[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shuvi-blender-agent"
version = "0.1.0"
description = "Typed, verified Blender control engine for Shuvi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shuvi-blender-agent = "shuvi_blender_agent.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
